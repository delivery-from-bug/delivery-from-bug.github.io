<!DOCTYPE html>
<html>

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Korean Fish Delivery!!</title>
    <link rel="stylesheet" type="text/css" href="style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Yeseva+One&display=swap" rel="stylesheet"> 

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans&family=Yeseva+One&display=swap" rel="stylesheet"> 
    
  </head>

  <body>

    <div id="next_slide" class="slide slide-hidden">
      <div class="words">
        <h1 id="next_header">hahahaha</h1>
        <p id="next_text" class="comment">
        hahahahahah 
        </p>
        <button id="next_buttonA" type="button" class="myButton">hoho</button>
        <button id="next_buttonB" type="button" class="myButton">hehe</button>
      </div>
    </div>

    <div id="my_slide" class="slide slide-reveal">
      <div class="words">
        <h1 id="my_header">Fish Delivery!</h1>
        <p id="my_text" class="comment">
        Hello Elizabete! Ready for some fresh fish?
        </p>
        <button id="my_buttonA" type="button" class="myButton"></button>
        <button id="my_buttonB" type="button" class="myButton">Click here!</button>
      </div>
    </div>

    <div id="vid_slide" class="slide slide-video">
      <video controls id="my_video"> 
        <source id="vid_source" type="video/mp4">
      </video>
    </div>
  
    <script src="script.js"></script>
  </body>
</html>
